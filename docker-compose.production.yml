# Reference production stack — builds the production Dockerfiles (nginx-
# served static frontend + compiled backend) instead of the dev images
# docker-compose.yml uses. Nothing here is a complete deployment on its own
# (no TLS termination, no managed MongoDB) — see doc for what's deliberately
# out of scope. Unlike the dev compose file, no secrets are hardcoded here:
# every sensitive value is read from the environment, so supply them via a
# real `.env` file (never committed — see server/.env.example) or your
# platform's secret manager before running this.
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Intentionally no `ports:` mapping to the host — only reachable by
    # other services on this compose network, per "keep MongoDB private."
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      # Repo root, not ./server — the image also COPYs the repo-root docs/
      # folder (see server/Dockerfile.production's header comment).
      context: .
      dockerfile: server/Dockerfile.production
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/sentry
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be set, e.g. https://your-domain.example}
      # Defaults to 'admin' like the Zod schema's own default — every real
      # deployment should still set this in the environment running
      # `docker compose`, not just in server/.env (which this stack never
      # reads; see server/Dockerfile.production, which never COPYs a .env).
      ADMIN_ROUTE_PREFIX: ${ADMIN_ROUTE_PREFIX:-admin}
      # Baked into the image too (see server/Dockerfile.production) —
      # repeated here so this file stays correct if that default ever moves.
      DOCS_DIR: /app/docs
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.production
      # Must match the backend's ADMIN_ROUTE_PREFIX above — baked into the
      # static bundle at build time, so changing it later requires
      # rebuilding this image, not just restarting the container.
      args:
        VITE_ADMIN_ROUTE_PREFIX: ${ADMIN_ROUTE_PREFIX:-admin}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  uploads_data:
