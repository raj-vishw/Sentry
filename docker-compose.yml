# Local development stack — frontend + backend + MongoDB.
# `docker compose up` and open http://localhost:5173
#
# The JWT secrets below are obvious placeholders for local dev only. Real
# environments must supply their own via a real .env / secrets manager —
# see server/.env.example.
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    # Bound to loopback only, not 0.0.0.0 — a dev convenience for connecting
    # a local Mongo GUI (e.g. Compass) to localhost:27017, without exposing
    # an unauthenticated database to the LAN/internet on a shared or
    # cloud-hosted dev machine.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./server
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/sentry
      JWT_SECRET: dev-only-access-secret-change-me
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      # Must match the frontend's VITE_ADMIN_ROUTE_PREFIX below. Fine to
      # leave as the default for local dev; a real deployment should not.
      ADMIN_ROUTE_PREFIX: admin
      DOCS_DIR: /app/docs
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads_data:/app/uploads
      - ./docs:/app/docs:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      VITE_ADMIN_ROUTE_PREFIX: admin
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:
